[package]
name = "cosaci"
version = "0.1.0"
edition = "2024"

[dependencies]
chacha20poly1305 = "0.10.1"
ciborium = "0.2.2"
ed25519-dalek = "2.2.0"
merlin = "3.0.0"
rcgen = "0.14.7"
rs_merkle = "1.5.0"
rustls = { version = "0.23.39", default-features = false, features = ["ring", "std"] }
schnorrkel = "0.11.5"
serde = { version = "1.0.228", features = ["derive"] }
serde-big-array = "0.5.1"
sha2 = "0.11.0"
wasmtime = { version = "44.0.0", default-features = false, features = ["cranelift", "runtime", "wat"] }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
hegeltest = "0.8.0"
rand = "0.10.1"
rand_chacha = "0.10.0"
rustls-pemfile = "2.2.0"

[[bench]]
name = "hot_paths"
harness = false
