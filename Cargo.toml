# ─── Workspace ──────────────────────────────────────────────────────────
# v0.2 workspace skeleton (issue #1). Until the per-crate moves land
# (issues #2/#3/#4), the cosaci package below remains the source of
# truth; the eight workspace members under crates/ and bins/ are
# stubs reserving their slots.

[workspace]
resolver = "2"
members = [
    "crates/cosaci-core",
    "crates/cosaci-state",
    "crates/cosaci-protocol",
    "crates/cosaci-vrf",
    "crates/cosaci-wasm",
    "crates/cosaci-jobs",
    "crates/cosaci-webhook",
    "bins/cosaci-admin",
    "bins/cosaci-coordinator",
    "bins/cosaci-agent",
    "bins/cosaci-demo",
    "bins/cosaci-webhook-listener",
]

[workspace.package]
version    = "0.5.0"
edition    = "2024"
license    = "MIT OR Apache-2.0"
repository = "https://github.com/copyleftdev/cosaci"
authors    = ["copyleftdev"]

# ─── Workspace lints (issue #9) ──────────────────────────────────────────
# Pedantic-as-warn at the workspace root; CI's `cargo clippy ... -D
# warnings` escalates them to errors. Members opt in via:
#     [lints]
#     workspace = true
#
# The `priority = -1` on the group so the explicit per-lint allows below
# can override it. Each allow has a justification — we don't disable
# whole categories without one.
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# We deal in u64/usize ID and size quantities all over the protocol and
# storage layers; on 64-bit hosts (the only target we support) these
# casts are exact, and the lints fire on every line that touches them.
cast_possible_truncation = "allow"
cast_possible_wrap       = "allow"
cast_precision_loss      = "allow"
cast_sign_loss           = "allow"

# `mod attestation { pub struct Attestation }` is the canonical Rust
# pattern for a focused module; renaming the type to satisfy this lint
# would harm readability everywhere it's used.
module_name_repetitions = "allow"

# Library functions return `Result<_, String>` (and similar simple
# error types) and the failure modes are documented in the body of
# the doc comment — not always under a `# Errors` heading. Adding the
# heading boilerplate to every fallible fn isn't worth the churn.
missing_errors_doc = "allow"

# `# Panics` headings are useful when a non-obvious panic exists, but
# requiring them on every fn that could panic via slicing produces
# more noise than value at this stage.
missing_panics_doc = "allow"

# Project names ("CosaCI", "WebAssembly", "TigerBeetle") trigger this
# lint because of their capitalization. Backticking brand names in
# every doc comment reads like the docs are quoting code; we'd rather
# keep the prose readable.
doc_markdown = "allow"

# Hegel's `#[hegel::test]` and `#[hegel::state_machine]` macros define
# every rule/test as `fn(tc: TestCase)` — even when the body doesn't
# draw from `tc`. Pedantic flags `tc` as "passed by value but not
# consumed"; the shape is set by the third-party macro.
needless_pass_by_value = "allow"

# Older `format!("{}", x)` style is sometimes clearer than `{x}` when
# the variable name is long or shadowed. Modernizing every callsite
# isn't worth the churn at this stage.
uninlined_format_args = "allow"

# Tests use `n, k, m, i, j` for numeric quantities — the conventional
# names in property-based testing. The lint trips on otherwise-readable
# combinations that wouldn't benefit from a rename.
many_single_char_names = "allow"

[workspace.dependencies]
chacha20poly1305 = "0.10.1"
ciborium         = "0.2.2"
ed25519-dalek    = "2.2.0"
hmac             = "0.13.0"
merlin           = "3.0.0"
rcgen            = "0.14.8"
rs_merkle        = "1.5.0"
rustls           = { version = "0.23.40", default-features = false, features = ["ring", "std"] }
rustls-pemfile   = "2.2.0"
schnorrkel       = "0.11.5"
serde            = { version = "1.0.228", features = ["derive"] }
serde-big-array  = "0.5.1"
serde_json       = "1.0.128"
sha2             = "0.11.0"
wasmtime         = { version = "44.0.1", default-features = false, features = ["cranelift", "runtime", "wat"] }
wat              = "1.247"
criterion        = { version = "0.8.2", features = ["html_reports"] }
hegeltest        = "0.8.1"
rand             = "0.10.1"
rand_chacha      = "0.10.0"
signal-hook      = "0.4.4"
tempfile         = "3.21"
time             = { version = "0.3", default-features = false, features = ["std"] }
tiny_http        = "0.12.0"
tokio            = { version = "1.52.1", features = ["rt", "rt-multi-thread", "net", "io-util", "time", "macros", "sync", "signal"] }
tokio-rustls     = { version = "0.26.4", default-features = false, features = ["ring"] }
toml             = "1.1.2"
tracing          = { version = "0.1.41", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.19", default-features = false, features = ["fmt", "env-filter"] }

# ─── Root package: cosaci v0.1.0 ────────────────────────────────────────
# A thin re-export shim now that issues #2/#3/#4 redistributed the
# modules across cosaci-{core,state,protocol,vrf,wasm}. The meta-crate
# stays so the 32 integration tests under `tests/` and the criterion
# benches under `benches/` can keep using `cosaci::*` paths.

[package]
name        = "cosaci"
version     = "0.5.0"
edition     = "2024"
license     = "MIT OR Apache-2.0"
repository  = "https://github.com/copyleftdev/cosaci"
description = "CosaCI: meta-crate that re-exports cosaci-{core,state,protocol,vrf,wasm} for tests + benches"
readme      = "README.md"
keywords    = ["distributed", "ci", "consensus", "wasm", "mtls"]
categories  = ["network-programming", "cryptography"]
publish     = false

[dependencies]
# After #4, the meta-crate is a thin re-export shim. It exists so the 32
# integration tests under `tests/` and the criterion benches under
# `benches/` can keep using `cosaci::*` paths. New code outside this
# repo should depend on the per-crate paths directly (e.g. `cosaci_core`).
cosaci-core     = { path = "crates/cosaci-core" }
cosaci-state    = { path = "crates/cosaci-state" }
cosaci-protocol = { path = "crates/cosaci-protocol" }
cosaci-vrf      = { path = "crates/cosaci-vrf" }
cosaci-wasm     = { path = "crates/cosaci-wasm" }
cosaci-jobs     = { path = "crates/cosaci-jobs" }
cosaci-webhook  = { path = "crates/cosaci-webhook" }

[dev-dependencies]
ciborium    = { workspace = true }
criterion   = { workspace = true }
hegeltest   = { workspace = true }
hmac        = { workspace = true }
rand        = { workspace = true }
rand_chacha = { workspace = true }
serde_json  = { workspace = true }
sha2        = { workspace = true }
tempfile    = { workspace = true }

[[bench]]
name    = "hot_paths"
harness = false

[lints]
workspace = true
