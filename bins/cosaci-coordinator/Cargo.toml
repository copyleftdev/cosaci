[package]
name        = "cosaci-coordinator"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
authors.workspace    = true
description = "CosaCI coordinator binary — accepts agent attestations, runs quorum, anchors to Merkle log"
readme      = "../../README.md"
keywords    = ["distributed", "ci", "coordinator", "quorum", "attestation"]
categories  = ["command-line-utilities", "network-programming"]
publish     = false

[dependencies]
cosaci-core     = { path = "../../crates/cosaci-core" }
cosaci-jobs     = { path = "../../crates/cosaci-jobs" }
cosaci-protocol = { path = "../../crates/cosaci-protocol" }
cosaci-state    = { path = "../../crates/cosaci-state" }
cosaci-vrf      = { path = "../../crates/cosaci-vrf" }
cosaci-wasm        = { path = "../../crates/cosaci-wasm" }
rustls             = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
signal-hook        = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }

# `coordinator` (not `cosaci-coordinator`) — the demo_networked subprocess
# launcher and existing CLI examples expect this short name.
[[bin]]
name = "coordinator"
path = "src/main.rs"

[lints]
workspace = true
