[package]
name        = "cosaci-admin"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
authors.workspace    = true
description = "CosaCI admin CLI — enrollment management + log inspection (filesystem-only for v0.3)"
readme      = "../../README.md"
keywords    = ["distributed", "ci", "admin", "cli", "enrollment"]
categories  = ["command-line-utilities"]
publish     = false

[dependencies]
cosaci-core     = { path = "../../crates/cosaci-core" }
cosaci-jobs     = { path = "../../crates/cosaci-jobs" }
cosaci-protocol = { path = "../../crates/cosaci-protocol" }
cosaci-state    = { path = "../../crates/cosaci-state" }
rustls          = { workspace = true }

# Short bin name; the runbook + dockerfile examples expect this.
[[bin]]
name = "cosaci-admin"
path = "src/main.rs"

[lints]
workspace = true
