name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  # Hegel uses a database of past failures keyed under .hegel/. CI
  # builds start from a clean slate every run; that's the right shape
  # for catching regressions, so we deliberately do NOT cache .hegel/.

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # `rust-toolchain.toml` at the repo root pins the toolchain and
      # installs `rustfmt` + `clippy` automatically; rustup respects it
      # on the next cargo invocation. No explicit setup-rust-toolchain
      # action is needed.
      - name: Show Rust toolchain
        run: |
          rustc --version
          cargo --version
          rustup show

      - name: Cache Cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          # Match the cache key on Cargo.lock so dep changes invalidate
          # cleanly. Workspace splits don't change the cache shape.
          shared-key: "ubuntu-stable"

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      # Clippy gate. Pedantic is wired through `[workspace.lints.clippy]`
      # at warn level (issue #9); `-D warnings` escalates each finding
      # to an error at this CI step.
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all-features

      - name: cargo bench --no-run (compile only)
        run: cargo bench --no-run

      - name: cargo doc
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --workspace

  smoke:
    name: Smoke test (networked demo)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache Cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ubuntu-stable"

      - name: Build coordinator + agent + demo_networked + verify
        run: |
          cargo build -p cosaci-coordinator --bin coordinator
          cargo build -p cosaci-agent       --bin agent
          cargo build -p cosaci-demo        --bin demo_networked
          cargo build -p cosaci-demo        --bin verify

      # End-to-end smoke test: networked demo runs two passes (bounded +
      # SIGTERM drain). Allow extra time for the SIGTERM round.
      - name: Run networked demo
        run: |
          set -euo pipefail
          OUT=$(timeout 60 cargo run --quiet -p cosaci-demo --bin demo_networked 2>&1)
          printf '%s\n' "$OUT"
          # Here-strings — avoids the SIGPIPE-on-`echo|grep -q` race that
          # `set -e` + `pipefail` treats as fatal in GitHub Actions.
          grep -q "outcome Pass"             <<<"$OUT"
          grep -q "anchored at position"     <<<"$OUT"
          grep -q "draining (signal received)" <<<"$OUT"
          grep -q "Both rounds completed cleanly" <<<"$OUT"

  # Audit gate (issue #10): hard fail on advisories / unapproved
  # licenses / unknown sources / wildcards. Policy lives in deny.toml
  # at the repo root.
  deny:
    name: cargo deny check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache Cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ubuntu-stable"

      - name: Install cargo-deny
        run: cargo install --locked cargo-deny

      - name: Run cargo deny
        run: cargo deny check

  # Deployment-artifact build gate (issue #49). Verify that both
  # production Dockerfiles build successfully on every PR. Single
  # arch (amd64) for speed; multi-arch (arm64) is exercised at
  # release-tag time in a separate workflow.
  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build coordinator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: contrib/docker/Dockerfile.coordinator
          push: false
          load: true
          tags: cosaci-coordinator:ci
          cache-from: type=gha,scope=cosaci-coordinator
          cache-to: type=gha,scope=cosaci-coordinator,mode=max

      - name: Build agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: contrib/docker/Dockerfile.agent
          push: false
          load: true
          tags: cosaci-agent:ci
          cache-from: type=gha,scope=cosaci-agent
          cache-to: type=gha,scope=cosaci-agent,mode=max

      - name: Build bootstrap image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: contrib/docker/Dockerfile.bootstrap
          push: false
          load: true
          tags: cosaci-bootstrap:ci
          cache-from: type=gha,scope=cosaci-bootstrap
          cache-to: type=gha,scope=cosaci-bootstrap,mode=max

      - name: Smoke-check coordinator binary in image
        run: |
          # The image entrypoint is `coordinator`; with no args it
          # tries to listen and fails (no certs). We check that --help
          # / --version-style invocation either succeeds or fails for
          # the expected reason (cert missing) — not for a broken
          # binary.
          docker run --rm cosaci-coordinator:ci --addr 127.0.0.1:0 \
              --ca /nonexistent --cert /nonexistent --key /nonexistent \
              2>&1 | tee /tmp/out || true
          grep -E "(NotFound|No such file)" /tmp/out

      - name: Smoke-check agent binary in image
        run: |
          docker run --rm cosaci-agent:ci --id 0 --addr 127.0.0.1:0 \
              --ca /nonexistent --cert /nonexistent --key /nonexistent \
              --server-name x --stake 0 \
              2>&1 | tee /tmp/out || true
          grep -E "(NotFound|No such file)" /tmp/out

      - name: Smoke-check bootstrap script
        run: |
          # Run the bootstrap container against a fresh tmp dir.
          # Verify it generates a CA + 5 agent certs.
          mkdir -p /tmp/cosaci-certs
          docker run --rm \
              -e FLEET=5 \
              -v /tmp/cosaci-certs:/certs \
              cosaci-bootstrap:ci
          test -f /tmp/cosaci-certs/ca.pem
          test -f /tmp/cosaci-certs/server.pem
          test -f /tmp/cosaci-certs/agent-0.pem
          test -f /tmp/cosaci-certs/agent-4.pem
