# Importable label definitions for github-label-sync.
# Usage: github-label-sync --access-token $GITHUB_TOKEN --labels .github/labels.yml copyleftdev/cosaci

- name: kind/bug
  color: d73a4a
  description: Something isn't working

- name: kind/feat
  color: a2eeef
  description: New feature or capability

- name: kind/refactor
  color: f9d0c4
  description: Code restructure with no behavior change

- name: kind/chore
  color: fef2c0
  description: Build / tooling / dep maintenance

- name: kind/docs
  color: "0075ca"
  description: Documentation

- name: kind/test
  color: bfd4f2
  description: Tests / fixtures / harnesses

- name: kind/perf
  color: f7c6c7
  description: Performance

- name: priority/P0
  color: b60205
  description: Blocker — drop everything

- name: priority/P1
  color: d93f0b
  description: Must ship in current milestone

- name: priority/P2
  color: fbca04
  description: Should ship in current milestone

- name: priority/P3
  color: "0e8a16"
